  ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,62,165,'+(.5+on*.5)+')';ctx.fillRect(cx-w/2-6,top+1,w+12,2);ctx.fillRect(cx-w/2-6,top+106,w+12,2);ctx.restore();
  var D={'3':[".XXX.","X...X","....X","..XX.","....X","X...X",".XXX."],'7':["XXXXX","....X","...X.","..X..",".X...",".X...",".X..."]},cell=8,x0=cx-46,y0=top+20;
  ['3','7'].forEach(function(d,k){var g=D[d];for(var rr=0;rr<7;rr++)for(var cc=0;cc<5;cc++)if(g[rr][cc]==='X'){var px=x0+k*50+cc*cell,py=y0+rr*cell,tw=.6+.4*Math.sin(T*6+rr+cc*2+k);ctx.fillStyle='#7a4a00';ctx.fillRect(px,py,cell,cell);ctx.fillStyle='rgba(255,'+(200+Math.round(40*tw))+',80,'+(.55+on*.45)+')';ctx.fillRect(px+1,py+1,cell-2,cell-2);ctx.fillStyle='rgba(255,255,220,'+(.4+on*.5)*tw+')';ctx.fillRect(px+2,py+2,2,2)}});
  ctx.fillStyle='#ffd36a';ctx.fillRect(cx-11,G-36,22,24);ctx.fillStyle='#ffe9b0';ctx.fillRect(cx-9,G-34,8,22);ctx.fillRect(cx+1,G-34,8,22);
  for(var s=0;s<4;s++){ctx.fillStyle=s%2?'#5a4a8a':'#6a5a9a';ctx.fillRect(cx-32-s*12,G-12+s*3,64+s*24,3)}}
function caption(t,y){ctx.font='9px "Press Start 2P"';ctx.textAlign='center';ctx.fillStyle='#000';ctx.fillText(t,W/2+1,y+1);ctx.fillStyle='#ffd23a';ctx.fillText(t,W/2,y);ctx.textAlign='left'}

/* ===== roteiro em loop: A (cogumelo e memórias) · B (37 anos) · C (ranking) ===== */
var DUR=[19,12,22],TOT=53,scene=-1;
var selo=document.getElementById('selo'),rank=document.getElementById('rank');
function frame(ts){requestAnimationFrame(frame);var dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;
  var tt=T%TOT,sc=tt<DUR[0]?0:tt<DUR[0]+DUR[1]?1:2,lt=sc===0?tt:sc===1?tt-DUR[0]:tt-DUR[0]-DUR[1];
  if(sc!==scene){scene=sc;parts=[];selo.classList.toggle('on',sc===1);rank.classList.toggle('on',sc===2);document.getElementById('mini').style.opacity=sc===2?0:1;if(sc===2)loadRank()}
  ctx.setTransform(S,0,0,S,0,0);ctx.imageSmoothingEnabled=false;
  if(sc===0)sceneA(lt);else if(sc===1)sceneB(lt);else sceneC(lt);
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=60*dt;if(p.life<=0){parts.splice(i,1);continue}
    if(p.k==='t'){ctx.font='7px "Press Start 2P"';ctx.fillStyle='#fff';ctx.globalAlpha=Math.min(1,p.life);ctx.fillText(p.txt,p.x-8,p.y);ctx.globalAlpha=1}else{ctx.fillStyle=p.c;ctx.globalAlpha=Math.min(1,p.life*1.5);ctx.fillRect(p.x|0,p.y|0,2,2);ctx.globalAlpha=1}}
}
var MEM=[['../direito.png','2011 · ME FORMEI EM DIREITO',18],['../tulipa.png','2013 · HOLANDA',28],['../buda.png','2019 · TAILÂNDIA',28],['../bola.png','2024 · NBA AO VIVO',22],['../ave.png','2025 · NORONHA',22],['../mascara.png','2026 · INDONÉSIA',28]].map(function(m,i){return {im:img(m[0]),cap:m[1],h:m[2],x:420+i*150,got:false}});
var BX=200,capTxt='',capT=0;
function bump(t,t0,d){return t>t0&&t<t0+d?Math.sin((t-t0)/d*Math.PI):0}
function sceneA(t){
  if(t<0.05){MEM.forEach(function(m){m.got=false});capT=0}
  var px,py=G,who='kid',anim='run',idx=Math.floor(t*14),cam;
  if(t<3.6){px=40+t*44.4}else px=200;
  var jt=t-3.7;if(jt>0&&jt<0.6){py=G-Math.sin(jt/0.6*Math.PI)*34;anim=jt<0.3?'jumpup':'fall';idx=0}
  else if(t>=3.6&&t<4.3){anim='idle'}
  var hit=t>3.95,bb=bump(t,3.95,0.25)*5;
  var mx=null,my=null,mt=t-4.0;
  if(mt>0&&mt<0.6){mx=BX;my=G-78-mt*30}
  else if(mt>=0.6&&mt<1.6){var u=mt-0.6;mx=BX+u*40;my=Math.min(G-18,G-96+u*u*260)}
  else if(mt>=1.6&&mt<2.2){mx=BX+40-(mt-1.6)*66;my=G-18}
  if(t>=4.3&&t<6.2){anim='idle'}
  var tf=t>=6.2&&t<7.8;
  if(t>=7.8){var rt=t-7.8;px=200+rt*92;who='adult';anim=rt<0.8?'cheer':'run';idx=Math.floor(t*16);
    MEM.forEach(function(m){var d=px-(m.x-48);if(d>0&&d<96){var u2=d/96;py=G-Math.sin(u2*Math.PI)*62;anim=u2<.4?'jumpup':(u2<.6?'apex':'fall');idx=0}})}
  cam=Math.max(0,px-W*0.38);
  sky(cam);ground(cam);
  var bx=BX-cam;ctx.fillStyle=hit?'#4a2a6a':'#ff3ea5';ctx.fillRect(bx-10,G-90-bb,20,20);ctx.fillStyle=hit?'#3a1f5a':'#ffb0dc';ctx.fillRect(bx-10,G-90-bb,20,2);ctx.fillStyle='#5a0a3a';ctx.fillRect(bx-10,G-71-bb,20,1);
  ctx.font='7px "Press Start 2P"';ctx.textAlign='center';ctx.fillStyle=hit?'#8a6ab0':'#fff';ctx.fillText('18',bx,G-76-bb);ctx.textAlign='left';
  if(!hit)glow(bx,G-80,18,'255,62,165',.35+.2*Math.sin(T*6));
  if(t>3.95&&t<4.4)for(var k=0;k<3;k++){ctx.fillStyle='#ffd23a';ctx.fillRect(bx-12+k*12,G-96-(t-3.95)*40,2,2)}
  if(mx!==null)ctx.drawImage(MUSH,Math.round(mx-cam-9),Math.round(my),18,18);
  MEM.forEach(function(m){if(m.got)return;var sx=m.x-cam;if(sx<-30||sx>W+30)return;var b=Math.sin(T*4+m.x)*2,y=G-92+b;
    glow(sx,y,20,'255,240,200',.6);
    if(m.im.width){var h=m.h,w=h*m.im.width/m.im.height;ctx.imageSmoothingEnabled=true;ctx.drawImage(m.im,sx-w/2,y-h/2,w,h);ctx.imageSmoothingEnabled=false}
    if(who==='adult'&&Math.abs(m.x-px)<12){m.got=true;puff(sx,y,'s',18);parts.push({x:sx,y:y-14,vx:0,vy:-30,life:1,k:'t',txt:'+20'});capTxt=m.cap;capT=1.6}});
  var dx=px-cam;
  if(tf){var f=Math.floor((t-6.2)*12)%2;ctx.fillStyle='rgba(255,62,165,'+(f?.16:0)+')';ctx.fillRect(0,0,W,H);spr(f?'adult':'kid','idle',0,dx,G);if(Math.random()<.5)puff(dx,G-30,'s',2)}
  else spr(who,anim,idx,dx,py);
  if(t>=6.2&&t<9)caption('18 ANOS: FASE ADULTA DESBLOQUEADA!',H*0.2);
  else if(capT>0){capT-=1/60;caption(capTxt,H*0.2)}
  if(t>DUR[0]-0.6){ctx.fillStyle='rgba(21,10,54,'+((t-(DUR[0]-0.6))/0.6)+')';ctx.fillRect(0,0,W,H)}
}
function sceneB(t){
  sky(0);var cx=W/2+60;tower(cx,Math.min(1,t/1.5));ground(0);
  var bx=W/2-60, an=t<4?'cheer':t<5?'front':'cool';spr('adult',an,0,bx,G,1.15);
  if(Math.random()<.09)fw();
  if(t<.1)puff(bx,G-60,'s',40);
}
function sceneC(t){sky(t*20);ground(t*30);ctx.fillStyle='rgba(21,10,54,.55)';ctx.fillRect(0,0,W,H);if(Math.random()<.03)fw()}

/* ===== ranking: rola de baixo pra cima e para no top 5 (um nome por pessoa) ===== */
var rows=document.getElementById('rows'),ttl=document.getElementById('ttl');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return'&#'+c.charCodeAt(0)+';'})}
function uniq(list){var seen={};return (list||[]).filter(function(r){var k=String(r.nome).trim().toLowerCase();if(seen[k])return false;seen[k]=1;return true})}
function loadRank(){fetch(RANK_URL).then(function(r){return r.json()}).then(function(d){if(d.aba!=='Braba')throw 0;paint(uniq(d.todos||d.top))}).catch(function(){document.getElementById('upd').textContent='sem conexão agora'})}
function paint(list){var md=['🥇','🥈','🥉'];
  rows.innerHTML=list.length?list.map(function(r,i){return '<div class="row p'+(i+1)+'"><span class="n"><span>'+(i<3?md[i]:(i+1)+'º')+'</span>'+esc(r.nome)+'</span><span>'+r.pontos+'</span></div>'}).join(''):'<div class="row"><span class="n">Ninguém ainda. Seja a primeira pessoa!</span></div>';
  var h=new Date();document.getElementById('upd').textContent=list.length+' jogadores · atualizado às '+String(h.getHours()).padStart(2,'0')+':'+String(h.getMinutes()).padStart(2,'0');
  var rowH=innerWidth*0.048,extra=Math.max(0,list.length-5)*rowH,dur=Math.min(11,Math.max(2,list.length*0.55));
  ttl.textContent=list.length>5?'RANKING':'TOP 5';
  rows.style.transition='none';rows.style.transform='translateY(-'+extra+'px)';void rows.offsetWidth;
  setTimeout(function(){rows.style.transition='transform '+dur+'s cubic-bezier(.4,0,.2,1)';rows.style.transform='translateY(0)';setTimeout(function(){ttl.textContent='TOP 5'},dur*1000)},900);
  rank.classList.remove('on');void rank.offsetWidth;if(scene===2)rank.classList.add('on')}
if(document.fonts)document.fonts.load('9px "Press Start 2P"').then(buildGraf);
requestAnimationFrame(frame);
document.addEventListener('click',function(){var e=document.documentElement;if(e.requestFullscreen)e.requestFullscreen().catch(function(){})});
</script></body></html>
