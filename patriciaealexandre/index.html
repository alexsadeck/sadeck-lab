}

.btn span{font-size:.86rem;color:var(--oliva);opacity:.8}
.btn:hover,.btn:active{background:var(--salvia);border-color:var(--salvia)}
.btn:focus-visible,.alt:focus-visible{outline:2px solid var(--linho);outline-offset:3px}
.alt{
  margin-top:.25rem;font-size:.95rem;color:var(--salvia);text-decoration:underline;
  text-decoration-thickness:1px;text-underline-offset:.25em;
}

.foto{margin:2.25rem 0 0;width:100%;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--oliva-fundo)}
.foto img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 50%;transform-origin:49% 32%;will-change:transform}
.place{margin-top:1.5rem}

@media (min-width:34rem){ .btns{grid-template-columns:1fr 1fr} }

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{from{opacity:0;transform:translateX(4%) scale(.96)}to{opacity:1;transform:translateX(4%)}}
