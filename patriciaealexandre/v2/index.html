/* Capa: foto em tela cheia com o convite em arco por cima, recortado como um nicho.
   Ao rolar, a capa sobe como uma cortina e revela o calendário, que fica parado por baixo. */
:root{
  --oliva:#5e6848;
  --salvia:#c4c3a5;
  --linho:#e8e5d6;
  --oliva-escuro:#4f583c;
  --serif:"Times New Roman", Tinos, Times, "Liberation Serif", serif;
}
*{box-sizing:border-box}
html{background:var(--oliva)}
body{margin:0;background:var(--oliva);color:var(--oliva);font-family:var(--serif);-webkit-font-smoothing:antialiased}

/* ---------- Capa ---------- */
.capa{
  position:relative;z-index:2;min-height:100svh;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 2.5rem) max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 4.5rem) max(16px, env(safe-area-inset-left,0px));
  box-shadow:0 18px 40px rgba(30,34,22,.35);
}
.capa-foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 34%;transform-origin:50% 34%;will-change:transform}
.capa::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,44,30,.10),rgba(40,44,30,0) 30%,rgba(40,44,30,.18));pointer-events:none}

.convite{
  position:relative;z-index:1;
  width:min(76vw, 22rem, calc((100svh - 16rem) * .6));
  min-width:15rem;
  display:flex;flex-direction:column;align-items:center;
  filter:drop-shadow(0 10px 28px rgba(30,34,22,.28));
}
.nicho{display:block;width:100%;height:auto}
.nicho .papel{fill:var(--linho)}
.nicho .fio{fill:none;stroke:var(--salvia);stroke-width:1.2}
.nicho .fio-fora{fill:none;stroke:var(--salvia);stroke-width:1}
.nicho-mono{position:absolute;top:7.2%;left:50%;width:34%;transform:translateX(-46%);color:var(--oliva)}
.nicho-mono svg{display:block;width:100%;height:auto}

.convite-texto{
  width:100%;margin-top:-1px;background:var(--linho);text-align:center;
  padding:.4rem 1.25rem 1.6rem;display:flex;flex-direction:column;align-items:center;
  border-left:0;border-right:0;
  box-shadow:inset 0 -1px 0 var(--salvia);
}
.eyebrow{margin:0;font-size:.82rem;letter-spacing:.2em;text-transform:uppercase;color:var(--oliva)}
.nomes{
  margin:.35rem 0 0;font-weight:400;font-style:italic;text-transform:lowercase;
  font-size:clamp(2rem,10.5vw,2.75rem);line-height:.98;letter-spacing:-.005em;color:var(--oliva);
}
.nomes span{display:block}
.nomes .e{font-size:.62em;line-height:1.25;color:var(--oliva)}
.data{margin:.7rem 0 0;font-size:1.05rem;letter-spacing:.12em;color:var(--oliva);font-variant-numeric:lining-nums}

.desce{
  position:absolute;z-index:1;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1.1rem);transform:translateX(-50%);
  width:2.6rem;height:2.6rem;border-radius:50%;background:var(--linho);color:var(--oliva);
  display:grid;place-items:center;text-decoration:none;box-shadow:0 4px 14px rgba(30,34,22,.25);
}
.desce svg{width:1.05rem;height:1.05rem}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,5px)}}
.desce{animation:bob 2.4s ease-in-out 2s infinite}

/* ---------- Calendário ---------- */
.cal{
  position:sticky;bottom:0;z-index:1;min-height:100svh;background:var(--oliva);color:var(--linho);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 3rem) max(20px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 3rem) max(20px, env(safe-area-inset-left,0px));
}
.cal h2{
  margin:0;font-weight:400;text-transform:uppercase;font-size:clamp(1.65rem,7.6vw,2.4rem);line-height:1.05;letter-spacing:.02em;
  color:var(--linho);text-wrap:balance;max-width:13ch;
}
.quadro{
  position:relative;width:min(100%,24rem);margin-top:2rem;background:var(--linho);color:var(--oliva);
  padding:1.4rem 1.25rem 1.5rem;
}
.quadro::before{content:"";position:absolute;inset:7px;border:1px solid var(--salvia);pointer-events:none}
.quadro::after{
  content:"";position:absolute;left:50%;top:-1px;width:3.4rem;height:1.7rem;transform:translateX(-50%);
  background:var(--oliva);border-radius:0 0 999px 999px;
}
.linhas{list-style:none;margin:.6rem 0 0;padding:0}
.linhas li{font-style:italic;text-transform:lowercase;font-size:1.22rem;padding:.75rem 0}
.linhas li+li{border-top:1px solid var(--salvia)}
.btns{display:grid;gap:.65rem;margin-top:.9rem}
.btn{
  display:flex;align-items:center;justify-content:center;min-height:3.3rem;padding:.7rem 1rem;
  background:var(--oliva);color:var(--linho);text-decoration:none;
  font-size:1.02rem;letter-spacing:.08em;text-transform:uppercase;
  transition:background-color .25s ease;-webkit-tap-highlight-color:transparent;position:relative;z-index:1;
}
.btn:hover,.btn:active{background:var(--oliva-escuro)}
.btn:focus-visible,.alt:focus-visible,.desce:focus-visible{outline:2px solid var(--oliva);outline-offset:3px}
.alt{
  display:inline-block;margin-top:.95rem;font-size:.95rem;color:var(--oliva);position:relative;z-index:1;
  text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.25em;
}
.rodape{margin:2.25rem 0 0;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--salvia)}
.rodape-mono{width:4.2rem;color:var(--salvia);margin-top:2.25rem;transform:translateX(4%)}
.rodape-mono svg{display:block;width:100%;height:auto}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.convite{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) .15s backwards}
@media (prefers-reduced-motion:reduce){.convite,.desce{animation:none!important}}
